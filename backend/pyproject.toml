[project]
name = "portfolio-playground-backend"
version = "0.1.0"
description = "FastAPI backend for Developer Portfolio & Playground"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
